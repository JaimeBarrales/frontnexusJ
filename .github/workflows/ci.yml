# Pipeline del front (sección 2.5 del enunciado):
#   pull request hacia dev o main -> tests + build de la imagen, SIN publicar
#   push a main (merge desde dev) -> tests + build + publicación en GHCR con sha-<commit> y latest
#   tag ep2 sobre main             -> publica la misma imagen con el tag ep2 (el que usa el compose.yaml)
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep2]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la lógica del front
        run: node --test tests/*.test.mjs

  imagen:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexus-front" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Etiquetas y labels (incluye org.opencontainers.image.revision)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Construir para la prueba de humo (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nexus-front:prueba
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo de la imagen
        run: sh tests/humo.sh nexus-front:prueba

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
